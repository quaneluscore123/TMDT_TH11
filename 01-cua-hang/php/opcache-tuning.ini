; OPcache tuning - vi du project co ~9500 file PHP (WC 5488 + wp-includes 2729 + mu-plugins...)
; mac dinh chi cache 4000 file -> miss -> doc qua bind-mount Windows cham ~10s/request
opcache.max_accelerated_files=12000
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.revalidate_freq=60
opcache.validate_timestamps=1
